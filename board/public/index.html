<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>任務看板</title>
<style>
:root{--bg:#fff;--fg:#1c1c1e;--mut:#6b6b70;--card:#f2f2f7;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#000;--fg:#f2f2f7;--mut:#9a9aa0;--card:#1c1c1e}}
body{margin:0;padding:12px 16px 40px;background:var(--bg);color:var(--fg);font:15px/1.4 -apple-system,sans-serif}
h1{font-size:20px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tabs button{border:0;border-radius:14px;padding:6px 12px;background:var(--card);color:var(--fg);font-size:14px}
.tabs button.on{background:#0a84ff;color:#fff}
.c{background:var(--card);border-radius:12px;padding:10px 12px;margin:8px 0}
.v{display:flex;gap:6px;margin:8px 0}.v button{border:0;border-radius:14px;padding:6px 14px;background:var(--card);color:var(--fg);font-size:14px}.v button.on{background:#0a84ff;color:#fff}
.g{overflow-x:auto;background:var(--card);border-radius:12px;padding:8px;margin:8px 0}.g svg{display:block}.g text{fill:#fff;font:600 11px -apple-system,sans-serif;pointer-events:none}.g .n{cursor:pointer}.g .sel{stroke:var(--fg);stroke-width:3}.g path{fill:none;stroke:var(--mut);stroke-width:1.5}
.lg{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;margin:6px 0}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.rp{border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--card)}.rp.bad{border-left:5px solid #ff453a}.rp.ok{border-left:5px solid #30a05a}.rp h2{font-size:16px;margin:0 0 6px}.rp .it{padding:4px 0;border-top:1px solid #8883}.rp .it b{display:inline}
.pl{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:8px 0;font-size:14px}.pl button{border:0;border-radius:14px;padding:6px 10px;background:var(--card);color:var(--fg);font-size:14px}.pl button.on{background:#0a84ff;color:#fff}.pl button b{margin-left:4px}.pl i{color:var(--mut);font-style:normal}.pl .sep{margin:0 4px;color:var(--mut)}
.grp{margin:10px 0}.grp>summary{font-size:17px;padding:6px 0;cursor:pointer}.sub{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mut);margin:8px 0 2px}.sub span:first-child{width:10px;height:10px;border-radius:3px;display:inline-block}
.c>.m{display:block}
.c b{display:block}.m{color:var(--mut);font-size:13px}
</style></head><body>
<h1>任務看板</h1><div class="m" id="wf"></div><div class="pl" id="pl"></div><div id="redp"></div><div id="perfp"></div><div class="v"><button data-v="g" class="on">關係圖</button><button data-v="l">列表</button></div><div id="gv"></div><div id="lv" hidden><div class="tabs" id="tabs"></div><div id="list">載入中…</div></div>
<script>
const S={rejected:'退回要修',new:'剛開卡',developing:'開發中',reviewing:'等審查',selftesting:'自測中',wait_queue:'等排隊',batching:'批測中',wait_parent:'已放行・等父卡',done_wait:'自測完畢・等父卡',waiting_parent:'暫緩・等接手卡',merged:'已合併',dropping:'放棄待查',dropped:'放棄'};
// 列表分大組（照流程走）；空的組不顯示；已合併、放棄預設收合
// 頁首流程摘要：只用少數大階段，子狀態合併計數；點一個階段只看那一類的卡
const PIPE=[['開卡',['new']],['開發',['developing']],['審查',['reviewing']],['自測',['selftesting','wait_queue','batching']],['已合併',['merged']],'|',['退回',['rejected']],['等父卡',['wait_parent','done_wait','waiting_parent']],['放棄',['dropping','dropped']]];
let focus=null;
function pipeDraw(){
  const chip=x=>`<button data-p="${x[0]}" class="${focus===x[0]?'on':''}">${x[0]}<b>${cards.filter(c=>x[1].includes(c.stage)).length}</b></button>`;
  const i=PIPE.indexOf('|');
  pl.innerHTML=PIPE.slice(0,i).map(chip).join('<i>→</i>')+'<span class="sep">｜</span>'+PIPE.slice(i+1).map(chip).join('');
}
pl.onclick=e=>{const b=e.target.closest('button[data-p]');if(!b)return;focus=focus===b.dataset.p?null:b.dataset.p;view='l';try{localStorage.setItem('rv','l')}catch(x){}draw()};
const GROUPS=[['要處理',['rejected','new','developing','reviewing'],true],['測試中',['selftesting','wait_queue','batching'],true],['等父卡',['wait_parent','done_wait','waiting_parent'],true],['完成',['merged'],false],['放棄',['dropping','dropped'],false]];
const COL={new:'#8e8e93',developing:'#0a84ff',reviewing:'#bf5af2',selftesting:'#ff9f0a',wait_parent:'#e0a030',done_wait:'#e0a030',wait_queue:'#d9b65c',batching:'#e08a00',merged:'#30a05a',rejected:'#ff453a',waiting_parent:'#c9a227',dropping:'#8e6a3c',dropped:'#636366'};
let cards=[],cur='reviewing',view='g',sel=null,showDone=false;
try{view=localStorage.getItem('rv')||'g'}catch(e){}
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function cardHtml(c){
    const r=c.rejected;
    const why=r?`<span class="m">${r.source==='review'?'審查退回':(r.halted?'排隊器暫停':'排隊器退回')}：${esc(r.reason||'')}${(r.failed_items||[]).length?'（紅項 '+(r.failed_items||[]).map(f=>esc(f.item_id)).join('、')+'）':''}</span>${(r.failed_items||[]).filter(f=>f.summary).map(f=>`<details class="m"><summary>${esc(f.item_id)} 失敗原因</summary><pre style="white-space:pre-wrap;margin:4px 0;font-size:12px">${esc(f.summary)}</pre></details>`).join('')}`:'';
    return `<div class="c"><b>${esc(c.id)}　${esc(c.title)}</b><span class="m">${esc(S[c.stage])}・優先 ${c.priority}${c.area?'・'+esc(c.area):''}${c.owner?'・'+esc(c.owner):''}${c.branch?'・'+esc(c.branch):''}</span>${c.stage==='waiting_parent'&&c.dropped&&c.dropped.superseded_by?`<span class="m">等接手卡 ${esc(c.dropped.superseded_by)} 進 main${c.dropped.discard_reason?'：'+esc(c.dropped.discard_reason):''}</span>`:''}${c.parent?`<span class="m">父卡 ${esc(c.parent)}（${esc(S[c.parent_stage]||c.parent_stage)}）${c.parent_blocked?'・父卡被放棄或不存在，需改接':(c.waiting_parent?'・等父卡合併':'')}</span>`:''}${why}</div>`}
// 關係圖：有父子關係的卡依父鏈分層由上往下畫（一串卡一條鏈）；沒有關係的卡收在下面的小方塊。已合併、放棄預設收起。
function graph(){
  const done=c=>c.stage==='merged'||c.stage==='dropped';
  const vis=cards.filter(c=>showDone||!done(c)), by=new Map(vis.map(c=>[c.id,c]));
  const kids=new Map(),hasP=new Set();
  vis.forEach(c=>{if(c.parent&&by.has(c.parent)){hasP.add(c.id);(kids.get(c.parent)||kids.set(c.parent,[]).get(c.parent)).push(c.id)}});
  const rel=vis.filter(c=>hasP.has(c.id)||kids.has(c.id)), alone=vis.filter(c=>!hasP.has(c.id)&&!kids.has(c.id));
  const W=118,H=34,GX=10,GY=34;let out='';
  // 連通分量
  const seen=new Set(),comps=[];
  const adj=id=>[...(kids.get(id)||[]),...(by.get(id).parent&&by.has(by.get(id).parent)?[by.get(id).parent]:[])];
  rel.forEach(c=>{if(seen.has(c.id))return;const q=[c.id],m=[];seen.add(c.id);while(q.length){const x=q.pop();m.push(x);adj(x).forEach(y=>{if(!seen.has(y)){seen.add(y);q.push(y)}})}comps.push(m)});
  comps.forEach(m=>{
    const depth={};const d=id=>{if(depth[id]!=null)return depth[id];depth[id]=0;const p=by.get(id).parent;return depth[id]=p&&by.has(p)?d(p)+1:0};m.forEach(d);
    const layers=[];m.forEach(id=>(layers[depth[id]]=layers[depth[id]]||[]).push(id));
    const pos={};let wmax=0;
    layers.forEach((L,i)=>{L.sort((a,b)=>(by.get(a).priority-by.get(b).priority)||a.localeCompare(b));L.forEach((id,j)=>{pos[id]={x:GX+j*(W+GX),y:GX+i*(H+GY)}});wmax=Math.max(wmax,L.length)});
    const w=GX+wmax*(W+GX),h=GX+layers.length*(H+GY)-GY+GX;
    let e='',nd='';
    m.forEach(id=>{const c=by.get(id),p=c.parent;if(p&&pos[p]){const a=pos[p],b=pos[id];e+=`<path d="M${a.x+W/2} ${a.y+H}C${a.x+W/2} ${a.y+H+GY/2} ${b.x+W/2} ${b.y-GY/2} ${b.x+W/2} ${b.y}"/>`}});
    m.forEach(id=>{const c=by.get(id),q=pos[id];nd+=`<g class="n" data-id="${esc(id)}"><rect x="${q.x}" y="${q.y}" width="${W}" height="${H}" rx="8" fill="${COL[c.stage]||'#888'}" class="${sel===id?'sel':''}"/><text x="${q.x+8}" y="${q.y+14}">${esc(id.slice(0,16))}</text><text x="${q.x+8}" y="${q.y+27}" opacity=".85">${esc(S[c.stage])}</text></g>`});
    out+=`<div class="g"><svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${e}${nd}</svg></div>`;
  });
  if(alone.length)out+=`<div class="m">單張卡（沒有父子關係）</div><div class="g"><svg width="${GX+Math.min(alone.length,3)*(W+GX)}" height="${GX+Math.ceil(alone.length/3)*(H+8)}">${alone.map((c,i)=>{const x=GX+(i%3)*(W+GX),y=GX+Math.floor(i/3)*(H+8);return `<g class="n" data-id="${esc(c.id)}"><rect x="${x}" y="${y}" width="${W}" height="${H}" rx="8" fill="${COL[c.stage]||'#888'}" class="${sel===c.id?'sel':''}"/><text x="${x+8}" y="${y+14}">${esc(c.id.slice(0,16))}</text><text x="${x+8}" y="${y+27}" opacity=".85">${esc(S[c.stage])}</text></g>`}).join('')}</svg></div>`;
  const lg=Object.keys(S).map(k=>`<span><i style="background:${COL[k]}"></i>${S[k]}</span>`).join('');
  gv.innerHTML=`<div class="lg">${lg}</div><div class="v"><button data-done="1" class="${showDone?'on':''}">${showDone?'隱藏':'顯示'}已合併／放棄</button></div>${out||'<div class="m">沒有卡</div>'}<div id="det">${sel&&cards.find(c=>c.id===sel)?cardHtml(cards.find(c=>c.id===sel)):'<div class="m">點一張卡看詳情</div>'}</div>`;
}
document.querySelector('.v').onclick=e=>{const v=e.target.dataset.v;if(v){view=v;try{localStorage.setItem('rv',v)}catch(x){}draw()}};
gv.onclick=e=>{if(e.target.dataset.done){showDone=!showDone;draw();return}const n=e.target.closest('.n');if(n){sel=n.dataset.id;draw()}};
function draw(){
  document.querySelectorAll('.v button[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  gv.hidden=view!=='g';lv.hidden=view!=='l';
  if(view==='g'){pipeDraw();graph();return}
  tabs.hidden=true;
  let open={};try{open=JSON.parse(localStorage.getItem('rg')||'{}')||{}}catch(e){open={}}
  pipeDraw();
  if(focus){const ks=(PIPE.find(x=>x[0]===focus)||[0,[]])[1];
    list.innerHTML=`<div class="m">只看「${focus}」・<a href="#" id="clr">顯示全部</a></div>`+ks.map(k=>{const l=cards.filter(c=>c.stage===k);return l.length?`<div class="sub"><span style="background:${COL[k]}"></span>${S[k]} <span class="m">${l.length}</span></div>`+l.map(cardHtml).join(''):''}).join('')||'<div class="m">沒有卡</div>';
    const c=document.getElementById('clr');if(c)c.onclick=e=>{e.preventDefault();focus=null;draw()};return}
  list.innerHTML=GROUPS.map(([name,ks,def])=>{
    const tot=cards.filter(c=>ks.includes(c.stage)).length;
    if(!tot)return '';
    const isOpen=open[name]===undefined?def:open[name];
    return `<details class="grp" data-g="${name}" ${isOpen?'open':''}><summary><b>${name}</b> <span class="m">${tot}</span></summary>`+ks.map(k=>{const l=cards.filter(c=>c.stage===k);return l.length?`<div class="sub"><span style="background:${COL[k]}"></span>${S[k]} <span class="m">${l.length}</span></div>`+l.map(cardHtml).join(''):''}).join('')+'</details>';
  }).join('')||'<div class="m">沒有卡</div>';
}
list.addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.g){let o={};try{o=JSON.parse(localStorage.getItem('rg')||'{}')}catch(x){}o[d.dataset.g]=d.open;try{localStorage.setItem('rg',JSON.stringify(o))}catch(x){}}},true);
tabs.onclick=e=>{if(e.target.dataset.k){cur=e.target.dataset.k;draw()}};
function redDraw(w){
  const L=w.red_items||[];
  if(!w.mode){redp.innerHTML='';return}
  const st=x=>S[x]||x;
  const lp=w.loop||{},t=ts=>ts?new Date(ts*1000).toLocaleString('zh-TW',{hour12:false}):'';
  if(!w.main_red&&!L.length){
    if(w.mode!=='direct_merge'){redp.innerHTML='<div class="rp"><h2>沒有背景測試</h2><div class="m">目前是閘門批測模式，main 的紅綠看批測結果。</div></div>';return}
    if(lp.last_result==='green'||lp.state==='green'){redp.innerHTML=`<div class="rp ok"><h2>main 全綠</h2><div class="m">背景測試最後一次通過${lp.last_run_at?'：'+t(lp.last_run_at):''}${lp.main_sha?'（'+esc(String(lp.main_sha).slice(0,8))+'）':''}</div></div>`;return}
    redp.innerHTML=`<div class="rp"><h2>尚未收到背景測試結果</h2><div class="m">背景測試${lp.state==='running'?'正在跑第一輪':'還沒有完成的結果'}${lp.last_run_at?'（開始 '+t(lp.last_run_at)+'）':''}，跑完才知道 main 紅綠。</div></div>`;return}
  const sus=(w.triage&&w.triage.suspects)||[];
  redp.innerHTML=`<div class="rp bad"><h2>main 紅項 ${L.length||'？'} 個${w.triage&&w.triage.status==='pending'?'（等總指揮讀 diff 判斷嫌疑）':''}</h2>`+
    (L.length?L.map(r=>`<div class="it"><b>${esc(r.item)}</b>${r.summary?`<span class="m"> ${esc(r.summary)}</span>`:''}<br><span class="m">${r.fixers.length?'修理中：'+r.fixers.map(f=>`${esc(f.id)}（${esc(st(f.stage))}${f.owner?'・'+esc(f.owner):''}）`).join('、'):(r.suspects.length?'嫌疑分支：'+r.suspects.map(esc).join('、')+'（驗證中）':'還沒有人在修')}</span></div>`).join(''):'<div class="m">紅項明細還沒回報</div>')+'</div>';
}
const trend=(rr,k,label,col)=>{const v=rr.map(r=>r.metrics&&r.metrics[k]);if(!v.some(x=>x!=null))return '';const mx=Math.max(...v.map(x=>x||0),1),H=36;return `<div class="m" style="margin-top:6px">${label}</div><svg width="${Math.max(rr.length*14,120)}" height="${H}">${v.map((x,i)=>x==null?'':`<rect x="${i*14}" y="${H-Math.max(2,x/mx*H)}" width="10" height="${Math.max(2,x/mx*H)}" rx="2" fill="${col}"><title>${x}</title></rect>`).join('')}</svg>`};
const rk=(t,a,f)=>(a||[]).length?`<div class="m" style="margin-top:6px">${t}（近幾輪）</div>`+a.slice(0,10).map(s=>`<div class="it"><b>${esc(s.item)}</b> <span class="m">${f(s)}（${s.runs} 輪）</span></div>`).join(''):'';
async function perfDraw(){
  try{
    const p=await(await fetch('/api/perf?n=30',{headers:{authorization:'Bearer '+tok}})).json();
    const R=(p.runs||[]);
    if(!R.length){perfp.innerHTML='';return}
    const rr=R.slice().reverse(),mx=Math.max(...rr.map(r=>r.wall_s),1),W=Math.max(rr.length*14,120),H=50;
    const bars=rr.map((r,i)=>`<rect x="${i*14}" y="${H-Math.max(2,r.wall_s/mx*H)}" width="10" height="${Math.max(2,r.wall_s/mx*H)}" rx="2" fill="#0a84ff"><title>${esc(new Date(r.at*1000).toLocaleString('zh-TW',{hour12:false}))}　${Math.round(r.wall_s)} 秒　CPU ${r.cpu_util==null?'?':Math.round(r.cpu_util*(r.cpu_util<=1?100:1))}%</title></rect>`).join('');
    const l=R[0],cpu=x=>x==null?'？':Math.round(x*(x<=1?100:1))+'%',m=s=>s>=120?(s/60).toFixed(1)+' 分':Math.round(s)+' 秒';
    perfp.innerHTML=`<div class="rp"><h2>背景測試效能</h2><div class="m">最近 ${R.length} 輪總耗時（越高越久；最新在右）</div><svg width="${W}" height="${H}">${bars}</svg><div class="m">最新一輪：${m(l.wall_s)}・CPU ${cpu(l.cpu_util)}・${l.cores??'？'} 核・${l.items??'？'} 項${l.kind?'・'+esc(l.kind):''}</div>`+
      (l.metrics?`<div class="m" style="margin-top:6px">畫面：FPS 平均 ${l.metrics.fps_avg??'？'}・最低 ${l.metrics.fps_min??'？'}｜繪製數 平均 ${l.metrics.draw_calls_avg??'？'}・最高 ${l.metrics.draw_calls_max??'？'}</div>`:'')+`<details style="margin-top:6px"><summary class="m">更多（趨勢與排行）</summary>`+(l.metrics?trend(rr,'fps_avg','FPS 平均趨勢','#30a05a')+trend(rr,'draw_calls_avg','繪製數平均趨勢','#bf5af2'):'')+
      rk('FPS 最低的項目',p.lowest_fps,s=>`平均 ${s.avg}・最低 ${s.min}・最近 ${s.last}`)+rk('繪製數最高的項目',p.most_draw_calls,s=>`平均 ${s.avg}・最高 ${s.max}・最近 ${s.last}`)+
      ((p.slowest||[]).length?`<div class="m" style="margin-top:6px">最慢項目（近 ${R.length} 輪平均）</div>`+p.slowest.slice(0,10).map(s=>`<div class="it"><b>${esc(s.item)}</b> <span class="m">平均 ${s.avg_s} 秒・最慢 ${s.max_s} 秒・最近 ${s.last_s} 秒（${s.runs} 輪）</span></div>`).join(''):'')+'</details></div>';
  }catch(e){}
}
function wfDraw(w){
  redDraw(w);
  const L=w.loop||{},st={idle:'閒置',running:'測試中',red:'紅燈',bisecting:'找兇手中',green:'綠燈'};
  S.batching=w.mode==='direct_merge'?'待合併':'批測中';
  const t=ts=>ts?new Date(ts*1000).toLocaleString('zh-TW',{hour12:false}):'';
  wf.textContent=w.mode?`流程：${w.mode==='direct_merge'?'直接合併（自測綠就合 main，背景循環對 main 跑完整測試）':'閘門批測（攢批測過才合 main）'}`+(w.mode==='direct_merge'&&w.loop?`｜背景循環：${st[L.state]||L.state||'未知'}${L.last_run_at?'・上次 '+t(L.last_run_at):''}${L.last_result?'・結果 '+L.last_result:''}`:'')+(w.triage&&w.triage.status==='pending'?'｜等總指揮讀 diff 判斷嫌疑':'')+(w.main_red?`｜main 紅燈${(w.main_red.failed_items||[]).length?'：'+w.main_red.failed_items.map(x=>x.item||x.name||x).slice(0,5).join('、'):''}`:'')+((w.open_hotfix||[]).length?`｜急修卡 ${(w.open_hotfix||[]).length} 張：${(w.open_hotfix||[]).map(h=>h.id).join('、')}`:''):'';
}
let tok='';try{tok=localStorage.getItem('rt')||''}catch(e){}
// 網址帶 #t=讀取權杖（# 後面不會送到伺服器）：記進瀏覽器後立刻從網址列拿掉，之後直接開網址就行
try{const q=new URLSearchParams(location.hash.slice(1)).get('t');if(q){tok=q;localStorage.setItem('rt',q);history.replaceState(null,'',location.pathname+location.search)}}catch(e){}
async function load(){
  try{
    const r=await fetch('/api/cards',{headers:{authorization:'Bearer '+tok}});
    if(r.status===401){tok=prompt('輸入讀取權杖')||'';try{localStorage.setItem('rt',tok)}catch(e){}; if(!tok){list.textContent='需要權杖';return} return load()}
    cards=await r.json();
    // 「審查通過自測中」只算排隊器真的在跑的（phase=selftesting）；還沒開始的分成等父卡（父卡沒進 main）與等排隊
    cards.forEach(c=>{if(c.stage==='selftesting'&&c.phase!=='selftesting')c.stage=c.waiting_parent?'wait_parent':'wait_queue';else if(c.stage==='batching'&&c.waiting_parent)c.stage='done_wait'});
    perfDraw();
    try{const w=await(await fetch('/api/workflow',{headers:{authorization:'Bearer '+tok}})).json();wfDraw(w)}catch(e){}
    draw()
  }catch(e){list.textContent='讀取失敗'}
}
load();setInterval(load,30000);
</script></body></html>
